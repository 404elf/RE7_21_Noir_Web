name: Browser game
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-web.txt
            requirements-web-dev.txt
      - run: pip install -r requirements-web-dev.txt
      - run: python -c "import re7_21, web.app; assert re7_21.pygame is None"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests -q
      - run: python tests/web_e2e.py
      - run: python tests/web_e2e.py --base-path /re7
      - run: python tests/web_ui_e2e.py
      - run: python tests/web_latency_e2e.py
      - run: python tests/web_ai_e2e.py
      - run: NOIR_TRUSTED_PROXIES=127.0.0.1 docker compose -f compose.yaml -f deploy/compose.proxy.example.yaml config --quiet
      - run: NOIR_BASE_PATH=/re7 docker compose -p noir-web-ci up --build -d --wait
      - run: python tests/web_e2e.py --url http://127.0.0.1:8000/re7
      - run: python tests/web_latency_e2e.py --url http://127.0.0.1:8000/re7
      - run: python tests/web_ui_e2e.py --url http://127.0.0.1:8000/re7
      - run: python tests/web_ai_e2e.py --url http://127.0.0.1:8000/re7
      - name: Export the tested image
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker tag noir-web-ci-game:latest "noir-web:$REVISION"
          docker save "noir-web:$REVISION" | gzip > .artifacts/noir-web-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: noir-web-image
          path: .artifacts/noir-web-image.tar.gz
          retention-days: 1
      - if: always()
        run: docker compose -p noir-web-ci down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: |
            .artifacts/web-*.png
            .artifacts/web-network.json
            .artifacts/web-ui-report.json
            .artifacts/web-latency-report.json
            .artifacts/web-ai-report.json
